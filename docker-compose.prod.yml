services:
  backend:
    image: crpi-76fbd77t4270ljs4-vpc.cn-hangzhou.personal.cr.aliyuncs.com/xueyang_me/backend:latest
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - GLM_API_KEY=${GLM_API_KEY}
      - GLM_API_BASE=${GLM_API_BASE:-https://open.bigmodel.cn/api/paas/v4/}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - QWEN_API_BASE=${QWEN_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/langgraph_data.db}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-true}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-xueyang}
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
    restart: always
    networks:
      - langgraph-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 300
      start_period: 40s

  frontend:
    image: crpi-76fbd77t4270ljs4-vpc.cn-hangzhou.personal.cr.aliyuncs.com/xueyang_me/frontend:latest
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - langgraph-network

networks:
  langgraph-network:
    driver: bridge

volumes:
  data:
  results:
